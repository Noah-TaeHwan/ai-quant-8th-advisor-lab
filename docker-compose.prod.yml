services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ai-quant-8th-advisor-lab-backend:latest}
    container_name: investment_prod_backend
    restart: unless-stopped
    ports:
      - "8801:8000"
      - "80:8000"
    env_file:
      - app/backend/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=investment_db
      - QDRANT_URL=http://qdrant:6333
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-local-development-search-key-change-me}
      - RAG_EMBEDDING_PROVIDER=hash
      - RAG_LLM_API_KEY=
      - RAG_LLM_MODEL=
    depends_on:
      - mongo
      - qdrant
      - meilisearch
    networks:
      - investment-prod-net

  mongo:
    image: mongo:7
    container_name: investment_prod_mongo
    restart: unless-stopped
    volumes:
      - investment_prod_mongo_data:/data/db
    networks:
      - investment-prod-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: investment_prod_qdrant
    restart: unless-stopped
    volumes:
      - investment_prod_qdrant_data:/qdrant/storage
    networks:
      - investment-prod-net

  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    container_name: investment_prod_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-development-search-key-change-me}
    volumes:
      - investment_prod_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - investment-prod-net

networks:
  investment-prod-net:
    driver: bridge

volumes:
  investment_prod_mongo_data:
  investment_prod_qdrant_data:
  investment_prod_meilisearch_data:
